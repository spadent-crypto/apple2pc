# No menu, no wait: straight into the kernel.
set default=0
set timeout=0
set timeout_style=hidden

# The picture mode the kernel keeps (VESA framebuffer). The first one the
# graphics card offers is used. To force one, put it first.
insmod vbe
set gfxpayload=1024x768x16,1024x768x32,800x600x16,800x600x32,640x480x16,auto

menuentry "Apple II" {
	linux /boot/bzImage root=PARTUUID=41325043-01 ro rootwait quiet loglevel=0 console=tty3 vt.global_cursor_default=0 consoleblank=0 logo.nologo
}

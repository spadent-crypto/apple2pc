# No menu, no wait: straight into the kernel.
set default=0
set timeout=0
set timeout_style=hidden

# The picture mode the kernel keeps (VESA framebuffer).
# RESOLUTION in APPLE2\display.txt (the FAT32 data partition, second
# partition of this disk) picks it: a WxH mode, or auto for the mode the
# monitor reports as its own (EDID). Without the file, or when the graphics
# card lacks that mode, 1024x768, 800x600 and 640x480 are tried in turn.
insmod vbe
insmod fat
insmod regexp
insmod test

set res=1024x768
set RESOLUTION=
regexp --set=1:disk '^([^,]+),' "$root"
if [ -f "($disk,msdos2)/display.txt" ]; then
	source "($disk,msdos2)/display.txt"
fi
# Keep only the setting itself (a file saved on Windows ends lines in CR).
regexp --set=1:res '^(auto|[0-9]+x[0-9]+)' "$RESOLUTION"

set fallback=1024x768x16,1024x768x32,800x600x16,800x600x32,640x480x16,auto
if [ "$res" = auto ]; then
	set gfxpayload=auto
elif [ "$res" = 1024x768 ]; then
	set gfxpayload=$fallback
else
	set gfxpayload=${res}x16,${res}x32,$fallback
fi

menuentry "Apple II" {
	linux /boot/bzImage root=PARTUUID=41325043-01 ro rootwait quiet loglevel=0 console=tty3 vt.global_cursor_default=0 consoleblank=0 logo.nologo video=vesafb:mtrr:3
}

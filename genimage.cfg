# Partition 1: the system (ext4, mounted read-only).
# Partition 2: FAT32 "APPLE2": disk images, save slots
# and settings. Windows can read and write it.

image data.vfat {
	vfat {
		label = "APPLE2"
		extraargs = "-F 32"
		files = {
			"apple2-data/disks",
			"apple2-data/saves",
			"apple2-data/linapple.conf",
			"apple2-data/wifi.txt",
			"apple2-data/sound.txt",
			"apple2-data/display.txt",
			"apple2-data/README.TXT"
		}
	}
	size = 256M
}

image disk.img {
	hdimage {
		partition-table-type = "mbr"
		# Fixed so the kernel finds its root as PARTUUID=41325043-01
		# on whichever disk the machine numbers it as.
		disk-signature = 0x41325043
	}

	partition boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition root {
		partition-type = 0x83
		bootable = "true"
		image = "rootfs.ext2"
	}

	partition data {
		partition-type = 0x0C
		image = "data.vfat"
	}
}
